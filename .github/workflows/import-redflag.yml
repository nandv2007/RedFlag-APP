name: Import RedFlag source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import exact RedFlag source snapshot
        env:
          SOURCE_REPO: https://github.com/JyothsnaReddy-6299/RedFlag--Phishing-and-Fraud-Alert-Platform.git
          SOURCE_SHA: 0aa2f11f56d082728404dd5d2e593731fc15e995
        run: |
          set -euo pipefail
          git show HEAD:LICENSE > "$RUNNER_TEMP/LICENSE"
          rm -rf "$RUNNER_TEMP/redflag-source"
          git clone "$SOURCE_REPO" "$RUNNER_TEMP/redflag-source"
          git -C "$RUNNER_TEMP/redflag-source" checkout "$SOURCE_SHA"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git/' "$RUNNER_TEMP/redflag-source"/ ./
          if [ ! -f LICENSE ]; then cp "$RUNNER_TEMP/LICENSE" LICENSE; fi
          sed -i 's#https://github.com/nandv2007/RedFlag--Phishing-and-Fraud-Alert-Platform.git#https://github.com/nandv2007/RedFlag-APP.git#g' README.md || true
          sed -i 's#cd RedFlag--Phishing-and-Fraud-Alert-Platform#cd RedFlag-APP#g' README.md || true
          rm -f .github/workflows/import-redflag.yml

      - name: Commit imported project
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import RedFlag phishing and fraud alert platform"
          git push origin HEAD:main
